<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">{{ '::Menu:Authors' | abpLocalization }}</h5>
      </div>
      <div class="text-end col col-md-6">
        <button id="export" class="btn btn-secondary me-2" type="button" (click)="exportToExcel()">
          <i class="fa fa-download me-1"></i>
          <span>{{ '::ExportToExcel' | abpLocalization }}</span>
        </button>
        <button
          *abpPermission="'SmartPantry.Authors.Create'"
          id="create"
          class="btn btn-primary"
          type="button"
          (click)="createAuthor()"
        >
          <i class="fa fa-plus me-1"></i>
          <span>{{ '::NewAuthor' | abpLocalization }}</span>
        </button>
      </div>
    </div>
  </div>

  <div class="card-body">
    <ngx-datatable [rows]="author().items" [count]="author().totalCount" [list]="list" default>
      <ngx-datatable-column
        [name]="'::Actions' | abpLocalization"
        [maxWidth]="150"
        [sortable]="false"
      >
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div ngbDropdown container="body" class="d-inline-block">
            <button
              class="btn btn-primary btn-sm dropdown-toggle"
              data-toggle="dropdown"
              aria-haspopup="true"
              ngbDropdownToggle
            >
              <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
            </button>
            <div ngbDropdownMenu>
              <button
                *abpPermission="'SmartPantry.Authors.Edit'"
                ngbDropdownItem
                (click)="editAuthor(row.id)"
              >
                {{ '::Edit' | abpLocalization }}
              </button>
              <button
                *abpPermission="'SmartPantry.Authors.Delete'"
                ngbDropdownItem
                (click)="delete(row.id)"
              >
                {{ '::Delete' | abpLocalization }}
              </button>
            </div>
          </div>
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column [name]="'::Name' | abpLocalization" prop="name" />
      <ngx-datatable-column [name]="'::BirthDate' | abpLocalization" prop="birthDate">
        <ng-template let-row="row" ngx-datatable-cell-template>{{ row.birthDate | date }}</ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column [name]="'::ShortBio' | abpLocalization" prop="shortBio" />
    </ngx-datatable>
  </div>
</div>

<abp-modal [visible]="isModalOpen()" (visibleChange)="isModalOpen.set($event)">
  <ng-template #abpHeader>
    <h3>{{ (selectedAuthor()?.id ? '::Edit' : '::NewAuthor') | abpLocalization }}</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form()!" (ngSubmit)="save()">
      <div class="mt-2">
        <label for="author-name">Name</label><span> * </span>
        <input type="text" id="author-name" class="form-control" formControlName="name" autofocus />
      </div>
      <div class="mt-2">
        <label for="author-birthDate">Birth date</label><span> * </span>
        <div class="input-group">
          <input
            class="form-control"
            name="datepicker"
            formControlName="birthDate"
            ngbDatepicker
            #d="ngbDatepicker"
          />
          <button class="btn btn-outline-secondary" type="button" (click)="d.toggle()">
            <i class="fa fa-calendar"></i>
          </button>
        </div>
      </div>
      <div class="mt-2">
        <label for="author-shortBio">Short bio</label>
        <textarea id="author-shortBio" class="form-control" formControlName="shortBio"></textarea>
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" abpClose>
      {{ '::Close' | abpLocalization }}
    </button>
    <abp-button iconClass="fa fa-check" (click)="save()" [disabled]="form()?.invalid">
      {{ 'AbpAccount::Save' | abpLocalization }}
    </abp-button>
  </ng-template>
</abp-modal>
